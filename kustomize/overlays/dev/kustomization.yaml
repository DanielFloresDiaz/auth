apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base
- auth-vpa.yaml

namespace: solomon

namePrefix: dev-

patches:
- path: patch.yaml

labels:
- includeSelectors: true
  pairs:
    environment: dev
    tier: dev

configMapGenerator:
- behavior: merge
  literals:
  - GOTRUE_LOG_LEVEL=debug
  - DB_NAME=postgres_auth_dev
  - API_EXTERNAL_URL=https://dev.solomonauth.com/
  - GOTRUE_SITE_URL=https://dev.solomonauth.com/
  - GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI=https://dev.solomonauth.com/callback
  - GOTRUE_URI_ALLOW_LIST=http://localhost:5173,http://localhost:5173/auth/callback,http://localhost:5174,http://localhost:5174/auth/callback,http://localhost:5175,http://localhost:5175/auth/callback,https://dev.insidec.org,https://dev.insidec.org/auth/callback,https://dashboard.dev.insidec.org,https://dashboard.dev.insidec.org/auth/callback,https://app.dev.zion-gateway.com
  - GOTRUE_OAUTH_SERVER_ENABLED=true
  - GOTRUE_OAUTH_SERVER_HANDOFF_CLIENT_ID=c3e1a7b2-4d58-4f0a-9c6e-2b7d8f0a1e34
  - GOTRUE_OAUTH_SERVER_HANDOFF_REDIRECT_URIS=http://localhost:5173/auth/handoff,http://localhost:5174/auth/handoff,https://app.dev.zion-gateway.com/auth/handoff
  name: auth-generated-config
images:
- name: ghcr.io/danielfloresdiaz/auth
  newName: ghcr.io/danielfloresdiaz/auth
  newTag: 0.0.2
